<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F7">
<title>Cartão fidelidade</title>
<meta name="robots" content="noindex, nofollow">
<!-- CONFIG e o tema visual (theme.js) vêm antes do <style>/<script> abaixo, pra já aplicar o
     tema no primeiro paint. Compartilhados com index.html, caixa.html e admin.html. -->
<script src="config.js"></script>
<script src="theme.js"></script>
<style>
  :root {
    --tema-fundo: #F7F7F7;
    --tema-texto: #000000;
    --tema-texto-secundario: rgba(0,0,0,.75);
    --tema-card: #FFFFFF;
    --tema-borda: #E0E0E0;
    --tema-primaria: #000000;
    --tema-texto-sobre-primaria: #FFD100;
    --tema-acento: #FFD100;
    --tema-texto-sobre-acento: var(--tema-texto);
    --tema-fonte-titulo: "Avenir Next", "Montserrat", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    --tema-fonte-corpo: "Avenir Next", "Montserrat", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    --tema-raio-card: 28px;
    --tema-raio-botao: 999px;
    --tema-sombra-card: 0 2px 8px rgba(0, 0, 0, .06);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--tema-fundo);
    color: var(--tema-texto);
    font-family: var(--tema-fonte-corpo);
    font-weight: 700;
    line-height: 1.35;
    overflow-x: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  .brand {
    text-align: center;
    padding: 6px 0 14px;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand img { max-height: 48px; max-width: 70%; object-fit: contain; }
  .brand .logo-placeholder {
    display: inline-flex; align-items: center; justify-content: center;
    border: 2px dashed var(--tema-texto); border-radius: 14px;
    padding: 10px 22px; opacity: .55;
    font-weight: 800; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .screen { display: none; }
  .screen.active { display: block; animation: enter .35s ease both; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  .card {
    background: var(--tema-card);
    border: 1px solid var(--tema-borda);
    border-radius: var(--tema-raio-card);
    padding: 24px 20px;
    box-shadow: var(--tema-sombra-card);
  }
  h2 { margin: 0 0 10px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; outline: none; font-size: 1.55rem; font-family: var(--tema-fonte-titulo); }
  p { margin: 0 0 16px; font-weight: 600; }
  .eyebrow {
    font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 8px;
  }
  .muted { font-size: .85rem; font-weight: 600; color: var(--tema-texto-secundario); }

  .btn {
    display: block; width: 100%; min-height: 58px; padding: 14px 24px;
    border: 2px solid var(--tema-primaria); border-radius: var(--tema-raio-botao);
    background: var(--tema-primaria); color: var(--tema-texto-sobre-primaria);
    font: inherit; font-weight: 900; font-size: 1.05rem; letter-spacing: .02em;
    cursor: pointer; transition: transform .12s ease, opacity .2s ease;
  }
  .btn:active:not(:disabled) { transform: scale(.96); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn.ghost { background: var(--tema-card); color: var(--tema-texto); }
  .btn + .btn { margin-top: 12px; }

  .link {
    background: none; border: 0; padding: 6px 0; font: inherit; font-size: .8rem; font-weight: 600;
    color: var(--tema-texto); text-decoration: underline; cursor: pointer; opacity: .7;
  }

  label { display: block; font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input {
    width: 100%; padding: 14px 18px; border: 2px solid var(--tema-texto); border-radius: 18px;
    background: var(--tema-fundo); color: var(--tema-texto); font: inherit; font-size: 16px; font-weight: 700;
    outline: none; -webkit-appearance: none; appearance: none;
  }
  input:focus { box-shadow: 0 0 0 3px var(--tema-acento), 0 0 0 5px var(--tema-texto); }
  input::placeholder { color: var(--tema-texto); opacity: .4; font-weight: 600; }

  .msg {
    margin: 0 0 14px; padding: 12px 16px; border-radius: 16px; background: var(--tema-texto); color: var(--tema-card);
    font-size: .9rem; font-weight: 700;
  }
  .msg.ok { background: var(--tema-acento); color: var(--tema-texto-sobre-acento); border: 2px solid var(--tema-texto); }

  .loyalty-stamps { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px 0; }
  .loyalty-stamp { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--tema-texto); background: var(--tema-card); }
  .loyalty-stamp.on { background: var(--tema-acento); }

  .coupon {
    border: 3px dashed var(--tema-texto); border-radius: 22px; padding: 16px 12px; text-align: center; margin: 4px 0 16px;
  }
  .coupon small { display: block; font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 4px; }
  .coupon strong { display: block; font-size: clamp(2rem, 11vw, 2.8rem); font-weight: 900; letter-spacing: .08em; }
  .policy { margin: 14px 0 0; font-size: .68rem; line-height: 1.4; font-weight: 600; opacity: .6; text-align: center; }

  .topline { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }

  .site-footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center;
    padding: 10px max(16px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom));
    background: rgba(247, 247, 247, .92);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-top: 1px solid #E0E0E0;
  }
  .site-footer a {
    display: inline-flex; align-items: center; gap: 8px;
    color: #000000; text-decoration: none;
    font-size: .72rem; font-weight: 700; letter-spacing: .01em;
  }
  .site-footer img { height: 24px; width: 24px; object-fit: contain; border-radius: 6px; display: block; }

  @media (prefers-reduced-motion: reduce) {
    .screen.active { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="brand" id="brand"></header>

  <main>
    <!-- Telefone -->
    <section class="screen" id="s-phone">
      <form class="card" id="form-phone" novalidate>
        <p class="eyebrow">Cartão fidelidade</p>
        <h2 tabindex="-1">Qual é o seu telefone?</h2>
        <p class="muted">Digite o telefone usado no seu cadastro para ver seus selos.</p>
        <div class="field">
          <label for="in-phone">WhatsApp</label>
          <input id="in-phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="15" placeholder="(11) 91234-5678">
        </div>
        <div class="msg" id="phone-msg" role="alert" hidden></div>
        <button class="btn" id="btn-phone" type="submit" disabled>Ver meu cartão</button>
      </form>
    </section>

    <!-- Cartão -->
    <section class="screen" id="s-card">
      <div class="card" style="text-align:center">
        <div class="topline" style="text-align:left">
          <p class="eyebrow" style="margin:0">Cartão fidelidade</p>
          <button class="link" id="btn-troca-telefone" type="button">Trocar telefone</button>
        </div>
        <h2 tabindex="-1" id="card-title"></h2>
        <div class="loyalty-stamps" id="card-stamps"></div>
        <p class="muted" id="card-progress-text"></p>
        <div class="msg" id="card-msg" role="alert" hidden></div>
        <a class="btn" id="btn-nova-avaliacao" href="index.html" style="text-decoration:none;text-align:center">Nova avaliação</a>
        <button class="btn" id="btn-retirar-premio" type="button" hidden>Retirar prêmio</button>
      </div>
    </section>

    <!-- Código de resgate gerado -->
    <section class="screen" id="s-redeem">
      <div class="card">
        <p class="eyebrow">Seu prêmio</p>
        <h2 tabindex="-1" id="redeem-title"></h2>
        <div class="coupon">
          <small>Código de resgate</small>
          <strong id="redeem-code"></strong>
        </div>
        <p class="muted" style="text-align:center" id="redeem-instruction"></p>
        <p class="policy" id="redeem-policy"></p>
        <button class="btn ghost" id="btn-redeem-back" type="button">Voltar ao cartão</button>
      </div>
    </section>
  </main>
</div>

<footer class="site-footer">
  <a href="https://underlinelab.com.br" target="_blank" rel="noopener">
    <img src="Assets/underline-logo.jpeg" alt="" width="24" height="24">
    <span>Desenvolvido por Underline</span>
  </a>
</footer>

<noscript><p style="padding:24px;text-align:center">Ative o JavaScript para ver o seu cartão fidelidade.</p></noscript>

<script>
(function () {
  'use strict';

  const $ = sel => document.querySelector(sel);
  // Guarda só o telefone (não o cartão inteiro): a consulta é sempre refeita no servidor,
  // que é quem manda nos selos. Mesmo padrão de chave de index.html/caixa.html.
  const PHONE_KEY = CONFIG.STORAGE_KEY + '-fidelidade';

  const state = { telefone: '', nome: '', selosAtuais: 0, meta: CONFIG.LOYALTY_GOAL };

  /* ---------- Utilidades ---------- */
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
    const h = $('#' + id + ' h2');
    if (h) h.focus({ preventScroll: true });
  }
  function setMsg(el, text, ok) {
    el.textContent = text || '';
    el.classList.toggle('ok', !!ok);
    el.hidden = !text;
  }
  function phoneGet() { try { return localStorage.getItem(PHONE_KEY) || ''; } catch (e) { return ''; } }
  function phoneSet(v) { try { v ? localStorage.setItem(PHONE_KEY, v) : localStorage.removeItem(PHONE_KEY); } catch (e) { /* ignora */ } }

  function maskPhone(digits) {
    const d = digits.slice(0, 11);
    if (d.length <= 2) return d.length ? '(' + d : '';
    if (d.length <= 7) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
    return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  }
  const PHONE_RE = /^\([1-9]\d\) \d{5}-\d{4}$/;

  function busy(btn, label) {
    btn.dataset.label = btn.dataset.label || btn.textContent;
    btn.disabled = !!label;
    btn.textContent = label || btn.dataset.label;
  }

  /* ---------- API (Apps Script) — mesmo padrão de retry das outras páginas ---------- */
  async function apiOnce(payload) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    try {
      const res = await fetch(CONFIG.WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      return await res.json();
    } catch (e) {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }
  async function api(payload) {
    let last = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt > 0) await new Promise(r => setTimeout(r, CONFIG.API_RETRY_DELAY_MS * attempt));
      const r = await apiOnce(payload);
      if (r && typeof r.ok === 'boolean') {
        if (!r.transient) return r;
        last = r;
      }
    }
    return last || { ok: false, network: true, error: 'Não foi possível se comunicar com o servidor. Verifique sua internet e tente novamente.' };
  }

  /* ---------- Marca ---------- */
  function initBrand() {
    document.title = CONFIG.LOYALTY_CARD_TITLE + ' — ' + CONFIG.RESTAURANT_NAME;
    const brand = $('#brand');
    const src = CONFIG.LOGO_DATA_URI || CONFIG.LOGO_URL;
    if (src) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = CONFIG.RESTAURANT_NAME;
      brand.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'logo-placeholder';
      ph.textContent = 'Seu logo aqui';
      brand.appendChild(ph);
    }
  }

  /* ---------- Telefone ---------- */
  function validatePhone() {
    const ok = PHONE_RE.test($('#in-phone').value);
    $('#btn-phone').disabled = !ok;
    return ok;
  }

  function goPhone() {
    setMsg($('#phone-msg'), '');
    show('s-phone');
    $('#in-phone').focus();
  }

  async function consultar(telefone) {
    const btn = $('#btn-phone');
    busy(btn, 'Consultando...');
    setMsg($('#phone-msg'), '');
    const r = await api({ action: 'fidelidadeConsultar', telefone: telefone });
    busy(btn);
    if (!r.ok) {
      setMsg($('#phone-msg'), r.error === 'Telefone não encontrado' ? CONFIG.LOYALTY_NOT_FOUND_MESSAGE : (r.error || 'Não foi possível consultar seu cartão.'));
      phoneSet('');
      show('s-phone');
      return;
    }
    state.telefone = telefone;
    state.nome = r.nome;
    state.selosAtuais = r.selosAtuais;
    state.meta = r.meta;
    phoneSet(telefone);
    renderCard();
    show('s-card');
  }

  function renderCard() {
    $('#card-title').textContent = (state.nome ? state.nome + ' — ' : '') + CONFIG.LOYALTY_CARD_TITLE;
    const wrap = $('#card-stamps');
    wrap.innerHTML = '';
    for (let i = 0; i < state.meta; i++) {
      const dot = document.createElement('span');
      dot.className = 'loyalty-stamp' + (i < state.selosAtuais ? ' on' : '');
      wrap.appendChild(dot);
    }
    const faltam = Math.max(0, state.meta - state.selosAtuais);
    const completo = state.selosAtuais >= state.meta;
    $('#card-progress-text').textContent = completo
      ? CONFIG.LOYALTY_COMPLETE_TEXT
      : CONFIG.LOYALTY_PROGRESS_TEXT.replace('{faltam}', faltam);
    $('#btn-retirar-premio').hidden = !completo;
    setMsg($('#card-msg'), '');
  }

  /* ---------- Resgate ---------- */
  async function gerarResgate() {
    const btn = $('#btn-retirar-premio');
    busy(btn, 'Gerando código...');
    setMsg($('#card-msg'), '');
    const r = await api({ action: 'fidelidadeGerarResgate', telefone: state.telefone });
    busy(btn);
    if (!r.ok) { setMsg($('#card-msg'), r.error || 'Não foi possível gerar o código de resgate.'); return; }
    $('#redeem-title').textContent = CONFIG.LOYALTY_PRIZE_LABEL;
    $('#redeem-code').textContent = r.codigo;
    $('#redeem-instruction').textContent = CONFIG.LOYALTY_REDEEM_INSTRUCTION;
    $('#redeem-policy').textContent = CONFIG.LOYALTY_REDEEM_POLICY_TEXT;
    show('s-redeem');
  }

  /* ---------- Inicialização ---------- */
  function init() {
    initBrand();
    $('#btn-retirar-premio').textContent = CONFIG.LOYALTY_REDEEM_BUTTON_TEXT;

    const phone = $('#in-phone');
    phone.addEventListener('input', () => { phone.value = maskPhone(phone.value.replace(/\D/g, '')); validatePhone(); });
    $('#form-phone').addEventListener('submit', e => {
      e.preventDefault();
      if (!validatePhone()) return;
      consultar(phone.value);
    });

    $('#btn-troca-telefone').addEventListener('click', () => { phoneSet(''); goPhone(); });
    $('#btn-retirar-premio').addEventListener('click', gerarResgate);
    $('#btn-redeem-back').addEventListener('click', async () => { await consultar(state.telefone); });

    const saved = phoneGet();
    if (saved && PHONE_RE.test(saved)) {
      phone.value = saved;
      consultar(saved);
    } else {
      goPhone();
    }
  }

  init();
})();
</script>
</body>
</html>
